<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Book Inventory</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <h1> Book Inventory</h1>

  <div class="card">
    <h2>Add Book</h2>

    <input id="title" placeholder="Title" />
    <input id="author" placeholder="Author" />
    <input id="price" placeholder="Price" type="number" />
    <input id="isbn" placeholder="ISBN (optional)" />

    <button onclick="addBook()">Add Book</button>
  </div>

  <div class="card">
  <h2>Search Book</h2>

  <input id="searchId" placeholder="Search by Book ID" />
  <button onclick="searchById()">Search by ID</button>

  <input id="searchIsbn" placeholder="Search by ISBN" />
  <button onclick="searchByIsbn()">Search by ISBN</button>

  <p id="searchResult"></p>
</div>


  <script src="script.js"></script>
</body>
</html>
